name: CI

on:
  push:
    branches: [main, "project/**"]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruby dependencies
        run: bundle install
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruby tests
        run: bundle exec ruby tests/test_analysis.rb
      - name: Render screenshots
        run: python scripts/render_readme_assets.py
      - name: Smoke check service
        run: python scripts/smoke_check.py
